<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美術方向 Mockup</title>
<!--
  美術方向 mockup（靜態，資料為示意）。參數：?dir=a|b&page=tonight|mine|stock&theme=dark|light
  A「夜間簡報」：純黑、字體排版為主角、超大主角數字、極細發光走勢線、大量留白。
  B「環境光」：A ＋ 頁首隨市場狀態變化的環境光暈、低調玻璃卡片、漂浮搜尋膠囊。
  所有圖示、版面、文案皆為原創；數字與英文用 Inter（SIL OFL 1.1，見 fonts/Inter-LICENSE.txt）。
-->
<style>
@font-face {
  font-family: 'Inter';
  src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
  font-weight: 100 900;
  font-display: block;
}

/* ====================== Tokens（實作時搬到 web/src/styles/tokens.css） ====================== */
:root {
  /* 字級：只有 5 級 */
  --fs-hero: 3.25rem;    --lh-hero: 3.5rem;     /* 52 / 56 主角數字 */
  --fs-title: 1.625rem;  --lh-title: 2.125rem;  /* 26 / 34 頁面標題、結論句 */
  --fs-section: 1.25rem; --lh-section: 1.75rem; /* 20 / 28 區塊標題 */
  --fs-body: 1rem;       --lh-body: 1.5rem;     /* 16 / 24 內文 */
  --fs-caption: 0.8125rem; --lh-caption: 1.25rem; /* 13 / 20 輔助文字 */
  /* 4pt 網格 */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px; --s16: 64px;
  --gutter: 20px;
  --r-card: 20px; --r-pill: 999px; --r-sm: 12px;
  --font: 'Inter', -apple-system, 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif;

  /* 深色（預設） */
  --bg: #000000;
  --surface-1: #111113;   /* 卡片 */
  --surface-2: #1c1c1f;   /* 浮起面板、軌道 */
  --surface-3: #2a2a2e;
  --text-1: #f5f5f7;
  --text-2: rgba(235, 235, 245, 0.62);
  --text-3: rgba(235, 235, 245, 0.32);
  --up: #ff5c4d;           /* 紅漲 */
  --down: #2ed47a;         /* 綠跌 */
  --up-tint: rgba(255, 92, 77, 0.16);
  --down-tint: rgba(46, 212, 122, 0.14);
  --risk: #ffb224;         /* 琥珀：只代表風險 */
  --risk-tint: rgba(255, 178, 36, 0.14);
  --brand: #3d8bff;        /* 電光藍：所有可互動元素 */
  --brand-fill: #1f6fff;
  --on-brand: #ffffff;
  --glow-opacity: 0.55;
  --glass: rgba(28, 28, 32, 0.55);
  --glass-hi: rgba(255, 255, 255, 0.10);
}
[data-theme='light'] {
  --bg: #f4f4f6;
  --surface-1: #ffffff;
  --surface-2: #ebebef;
  --surface-3: #dedee4;
  --text-1: #0b0b0d;
  --text-2: rgba(40, 40, 48, 0.70);
  --text-3: rgba(40, 40, 48, 0.30);
  --up: #d4261b;
  --down: #0f8042;
  --up-tint: rgba(212, 38, 27, 0.10);
  --down-tint: rgba(15, 128, 66, 0.10);
  --risk: #b35c00;
  --risk-tint: rgba(245, 150, 20, 0.16);
  --brand: #0a5bd8;
  --brand-fill: #0a5bd8;
  --glow-opacity: 0.22;
  --glass: rgba(255, 255, 255, 0.62);
  --glass-hi: rgba(255, 255, 255, 0.9);
}

* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
[data-theme='light'] body, body[data-theme='light'] { background: var(--bg); }
body {
  font-family: var(--font);
  font-size: var(--fs-body); line-height: var(--lh-body);
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'tnum' 1, 'cv11' 1;
}
.screen { position: relative; width: 393px; min-height: 852px; margin: 0 auto; background: var(--bg); overflow: hidden; padding-bottom: 120px; }

/* ---- 5 級字級 ---- */
.hero { font-size: var(--fs-hero); line-height: var(--lh-hero); font-weight: 600; letter-spacing: -0.035em; }
.title { font-size: var(--fs-title); line-height: var(--lh-title); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.section { font-size: var(--fs-section); line-height: var(--lh-section); font-weight: 600; margin: 0; }
.body { font-size: var(--fs-body); line-height: var(--lh-body); }
.cap { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-2); }
.t1 { color: var(--text-1); }
.w5 { font-weight: 500; } .w6 { font-weight: 600; }
.up { color: var(--up); } .down { color: var(--down); } .risk { color: var(--risk); } .brand { color: var(--brand); }

.pad { padding: 0 var(--gutter); }
.row { display: flex; align-items: center; gap: var(--s3); }
.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack > * + * { margin-top: var(--s2); }

/* ---- 狀態列、頂列 ---- */
.status { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 14px 30px 0 44px; font-size: 16px; font-weight: 600; position: relative; z-index: 2; }
.status svg { display: block; }
.topbar { display: flex; align-items: center; gap: var(--s2); height: 44px; padding: 0 12px 0 var(--gutter); position: relative; z-index: 2; }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--brand); border-radius: 50%; }
.icon-btn svg { width: 24px; height: 24px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); }
.avatar svg { width: 20px; height: 20px; }
.text-btn { color: var(--brand); font-weight: 500; padding: 0 var(--s2); height: 44px; display: inline-flex; align-items: center; }

/* ---- 結論、燈號 ---- */
.eyebrow { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-2); font-weight: 500; }
.env { display: inline-flex; align-items: center; gap: var(--s2); height: 32px; padding: 0 var(--s3) 0 10px; border-radius: var(--r-pill); background: var(--surface-1); font-size: var(--fs-caption); }
.env .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--risk); box-shadow: 0 0 0 3px var(--risk-tint), 0 0 12px var(--risk); }
.env .dot.neutral { background: var(--text-2); box-shadow: none; }
.env .dot.calm { background: var(--text-1); box-shadow: 0 0 10px rgba(255,255,255,.5); }
.est { display: inline-flex; align-items: center; justify-content: center; height: 18px; padding: 0 5px; margin-left: 4px; border-radius: 5px; font-size: 11px; line-height: 1; color: var(--text-2); background: var(--surface-2); vertical-align: 2px; font-weight: 500; }

/* ---- 區塊 ---- */
.block { padding: var(--s10) var(--gutter) 0; }
.block .eyebrow { margin-bottom: var(--s1); }
.card { background: var(--surface-1); border-radius: var(--r-card); padding: var(--s4); }
.card + .card { margin-top: var(--s2); }
.collapsed { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 var(--s4); border-radius: var(--r-card); color: var(--text-2); font-size: var(--fs-caption); }
.collapsed svg { width: 16px; height: 16px; color: var(--text-2); }
.link { color: var(--brand); font-weight: 500; font-size: var(--fs-caption); display: inline-flex; align-items: center; gap: 2px; }
.link svg { width: 14px; height: 14px; }

/* ---- 標籤、膠囊 ---- */
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--r-pill); font-size: 12px; font-weight: 600; }
.tag.risk { background: var(--risk-tint); color: var(--risk); }
.tag.soft { background: var(--surface-2); color: var(--text-2); font-weight: 500; }
.pill { display: inline-flex; align-items: center; justify-content: center; min-width: 76px; height: 26px; padding: 0 8px; border-radius: 8px; font-size: var(--fs-caption); font-weight: 600; }
.pill.up { background: var(--up-tint); }
.pill.down { background: var(--down-tint); }
.ghost-delta { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: var(--r-pill); background: var(--surface-1); color: var(--text-2); font-size: 12px; font-weight: 500; margin-left: var(--s3); vertical-align: 1px; opacity: 0.8; }

/* ---- 期間選擇器 ---- */
.periods { display: flex; justify-content: space-between; padding: 0 12px; margin-top: var(--s3); }
.periods span { min-width: 44px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-pill); font-size: var(--fs-caption); font-weight: 600; color: var(--brand); padding: 0 10px; }
.periods span.on { background: var(--brand-fill); color: var(--on-brand); }

/* ---- 分段控制 ---- */
.seg { display: flex; background: var(--surface-1); border-radius: 12px; padding: 3px; }
.seg span { flex: 1; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-size: var(--fs-caption); color: var(--text-2); font-weight: 500; }
.seg span.on { background: var(--surface-3); color: var(--text-1); font-weight: 600; }
.seg span b { font-weight: 500; color: var(--text-2); margin-left: 6px; }

/* ---- 清單列 ---- */
.list-row { display: grid; grid-template-columns: 1fr 64px 88px 32px; align-items: center; gap: var(--s3); min-height: 68px; padding: 10px 0; }
.list-row .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .price { text-align: right; }
.list-row .price .body { font-weight: 500; }
.list-row .price .pill { margin-top: 2px; }
.change-note { display: block; margin-top: 2px; }

/* ---- 分數環 ---- */
.rings4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); text-align: center; }
.ring { position: relative; width: 64px; height: 64px; margin: 0 auto; }
.ring svg { position: absolute; inset: 0; }
.ring .v { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: var(--fs-section); font-weight: 600; letter-spacing: -0.02em; }
.mini-ring { position: relative; width: 32px; height: 32px; }
.mini-ring svg { position: absolute; inset: 0; }
.mini-ring .v { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text-1); }

/* ---- 紀律三環 ---- */
.discipline { display: grid; grid-template-columns: 132px 1fr; gap: var(--s5); align-items: center; }
.legend > div { display: grid; grid-template-columns: 10px 1fr auto; gap: var(--s2); align-items: center; min-height: 32px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--text-1); display: block; }

/* ---- 法人柱狀圖 ---- */
.explain { background: var(--surface-1); border-radius: var(--r-card); padding: var(--s4); margin-top: var(--s4); }

/* ---- Tab bar ---- */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 24px 30px; background: linear-gradient(to top, var(--bg) 60%, rgba(0,0,0,0)); z-index: 5; }
[data-theme='light'] .tabbar { background: linear-gradient(to top, var(--bg) 60%, rgba(244,244,246,0)); }
.tabbar span { display: flex; align-items: center; justify-content: center; color: var(--text-2); }
.tabbar span.on { color: var(--brand); }
.tabbar svg { width: 26px; height: 26px; }

/* ====================== B「環境光」 ====================== */
.ambient { position: absolute; left: -30%; right: -30%; top: -260px; height: 640px; pointer-events: none; z-index: 0; filter: blur(8px); }
.ambient.up { background: radial-gradient(50% 50% at 50% 50%, rgba(255, 84, 62, 0.42), rgba(255, 84, 62, 0.10) 55%, rgba(255, 84, 62, 0) 75%); }
.ambient.down { background: radial-gradient(50% 50% at 50% 50%, rgba(40, 200, 150, 0.36), rgba(40, 200, 150, 0.08) 55%, rgba(40, 200, 150, 0) 75%); }
.ambient.risk { background: radial-gradient(50% 50% at 50% 50%, rgba(255, 170, 40, 0.40), rgba(255, 170, 40, 0.09) 55%, rgba(255, 170, 40, 0) 75%); }
[data-theme='light'] .ambient { opacity: 0.55; }
.content { position: relative; z-index: 1; }
[data-dir='b'] .card, [data-dir='b'] .explain, [data-dir='b'] .env, [data-dir='b'] .seg {
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
  backdrop-filter: blur(24px) saturate(150%);
  box-shadow: inset 0 0.5px 0 var(--glass-hi);
}
[data-dir='b'] .tabbar {
  left: 20px; right: 20px; bottom: 24px; height: 60px; padding: 0 12px; border-radius: 30px;
  background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  box-shadow: inset 0 0.5px 0 var(--glass-hi), 0 12px 32px rgba(0,0,0,.35);
}
[data-dir='b'][data-theme='light'] .tabbar { box-shadow: inset 0 0.5px 0 var(--glass-hi), 0 12px 32px rgba(0,0,0,.10); }
.search-float { position: absolute; left: 50%; transform: translateX(-50%); bottom: 96px; height: 44px; width: 232px; border-radius: 22px; display: flex; align-items: center; gap: 10px; padding: 0 18px; z-index: 6; color: var(--text-2); font-size: 15px;
  background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  box-shadow: inset 0 0.5px 0 var(--glass-hi), 0 12px 32px rgba(0,0,0,.35); }
.search-float svg { width: 18px; height: 18px; color: var(--text-1); }
</style>
</head>
<body>
<div id="screen" class="screen"></div>
<script>
const P = new URLSearchParams(location.search);
const DIR = P.get('dir') || 'a';
const PAGE = P.get('page') || 'tonight';
const THEME = P.get('theme') || 'dark';
document.body.dataset.dir = DIR;
document.body.dataset.theme = THEME;
document.documentElement.dataset.theme = THEME;
const screen = document.getElementById('screen');
screen.dataset.dir = DIR;
screen.dataset.theme = THEME;

/* ---------- 原創線條圖示（24×24，1.6 描邊，圓角端點） ---------- */
const I = (d, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
const ICON = {
  tonight: I('<path d="M19.5 14.6A7.6 7.6 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1Z"/><path d="M16.5 4.2v2.6M15.2 5.5h2.6"/>'),
  mine: I('<path d="M3.5 16.5 8.5 11l3.6 3.4L20.5 6"/><path d="M3.5 20.5h17"/>'),
  explore: I('<circle cx="12" cy="12" r="8.6"/><path d="m15.4 8.6-2 4.8-4.8 2 2-4.8 4.8-2Z"/>'),
  discipline: I('<circle cx="12" cy="12" r="8.6"/><path d="M12 7.2a4.8 4.8 0 1 1-4.8 4.8"/><circle cx="12" cy="12" r="1.2"/>'),
  person: I('<circle cx="12" cy="8.6" r="3.4"/><path d="M5.2 19.4c1.2-3.2 3.8-4.8 6.8-4.8s5.6 1.6 6.8 4.8"/>'),
  search: I('<circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.6 4.6"/>'),
  back: I('<path d="M14.8 5.2 8 12l6.8 6.8"/>'),
  star: I('<path d="m12 4.2 2.3 4.8 5.2.7-3.8 3.6.9 5.2L12 16l-4.6 2.5.9-5.2-3.8-3.6 5.2-.7L12 4.2Z"/>'),
  chevDown: I('<path d="m6.5 9.5 5.5 5.5 5.5-5.5"/>'),
  chevRight: I('<path d="m9.5 6.5 5.5 5.5-5.5 5.5"/>'),
};

/* ---------- 示意資料 ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function walk(n, start, end, vol, seed) {
  const r = rng(seed); const a = [start];
  for (let i = 1; i < n; i++) a.push(a[i - 1] * (1 + (r() - 0.5) * vol));
  const drift = (end - a[n - 1]);
  return a.map((v, i) => v + drift * (i / (n - 1)));
}
const fmt = (v, d = 2) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });

/* ---------- 走勢線：極細、發光、無座標軸與格線 ---------- */
let gid = 0;
function glowLine(values, { w = 393, h = 180, color = 'var(--up)', area = false, baseline = null, pad = 12, dot = true } = {}) {
  const id = `g${gid++}`;
  const min = Math.min(...values, baseline ?? Infinity), max = Math.max(...values, baseline ?? -Infinity);
  const x = (i) => (i / (values.length - 1)) * (w - 2 * pad) + pad;
  const y = (v) => pad + (1 - (v - min) / (max - min || 1)) * (h - 2 * pad);
  const d = values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const last = values.length - 1;
  const areaPath = `${d}L${x(last).toFixed(1)},${h}L${x(0).toFixed(1)},${h}Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible" aria-hidden="true">
    <defs>
      <filter id="${id}b" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
      <linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient>
    </defs>
    ${baseline !== null ? `<line x1="${pad}" x2="${w - pad}" y1="${y(baseline)}" y2="${y(baseline)}" stroke="var(--text-3)" stroke-width="1" stroke-dasharray="1 5" stroke-linecap="round"/>` : ''}
    ${area ? `<path d="${areaPath}" fill="url(#${id}a)"/>` : ''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="5" stroke-opacity="var(--glow-opacity)" filter="url(#${id}b)" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dot ? `<circle cx="${x(last)}" cy="${y(values[last])}" r="9" fill="${color}" opacity=".18"/><circle cx="${x(last)}" cy="${y(values[last])}" r="3.5" fill="${color}"/>` : ''}
  </svg>`;
}
function spark(values, dir, baseline) {
  return glowLine(values, { w: 64, h: 32, color: dir === 'up' ? 'var(--up)' : 'var(--down)', baseline, pad: 3, dot: false });
}
function ring(value, { size = 64, stroke = 4, label = '' } = {}) {
  const r = (size - stroke) / 2 - 1, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--text-1)" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${(c * value) / 100} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
  </svg>`;
}
function bars(values, { w = 353, h = 120 } = {}) {
  const max = Math.max(...values.map(Math.abs));
  const bw = w / values.length;
  const mid = h / 2;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block" aria-hidden="true">${values.map((v, i) => {
    const bh = Math.max(1.5, (Math.abs(v) / max) * (mid - 4));
    const yy = v >= 0 ? mid - bh : mid;
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${v >= 0 ? 'var(--up)' : 'var(--down)'}" opacity="${i >= values.length - 5 ? 1 : 0.72}"/>`;
  }).join('')}</svg>`;
}

const statusBar = () => `<div class="status"><span>21:42</span><span class="row" style="gap:6px">
  <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0M4.2 7a5.6 5.6 0 0 1 7.6 0"/><circle cx="8" cy="10" r="1" fill="currentColor"/></svg>
