# 波段策略（2026-10-01 新增；2026-10-02 第二輪改版，docs/swing/HYPOTHESIS.md、TRIALS.md）
# 每套最多 3 個可調參數、整數或常見門檻、不做網格最佳化；三段固定日期切分與九項上線門檻集中在 config/evidence.yml 的 swing_gates。
# enabled 是註冊清單的啟用旗標（一行可還原）；實際是否上架＝旗標 AND 分級（有效／觀察中），分級由資料重算（selection.py）。
# 共用規則（加權指數在 240 日線下不開新倉、20 日乖離 > 20% 不進場）在組合層套用、不計入參數（evidence.yml swing_gates.common_rules）。
version: 2
strategies:
  - id: rev_strong
    enabled: true
    label: 營收高強勢
    subtitle: 月營收創 12 個月新高・RS ≥ 70・20 日乖離 ≤ 10%・持有 40 日
    family: 基本面
    base: rev_high12                    # 基礎事件：月營收創 12 個月新高（次月 10 日生效）
    hold: 40
    params: { rs_min: 70, bias_max: 0.10 }
  - id: high_flow
    enabled: true
    label: 近高點外資買
    subtitle: 首次回到 52 週高點 95%・外資 5 日買超・大盤年線上・成交值 ≥ 1 億・持有 20 日
    family: 動能
    base: high52                        # 基礎事件：收盤 ÷ 前 252 日最高收盤首次 ≥ 0.95
    hold: 20
    params: { value_min: 100000000 }
    filters: [foreign5_pos, regime_up]  # 固定條件（沒有參數）
  - id: rs_flow
    enabled: true
    label: 強勢股外資買
    subtitle: RS 百分位首次站上 90・外資 5 日買超・大盤年線上・成交值 ≥ 1 億・持有 40 日
    family: 動能
    base: rs90                          # 基礎事件：RS 百分位當日 ≥ 90 且前一日 < 90
    hold: 40
    params: { value_min: 100000000 }
    filters: [foreign5_pos, regime_up]
  # ---- 第二輪新策略（2026-10-02；每一族最多 3 個版本，本輪合計最多 9 次嘗試）
  - id: rev_confirm
    enabled: true
    label: 營收高帶量
    subtitle: 月營收創 12 個月新高・生效日收漲且量 ≥ 1.5 倍・RS ≥ 70・持有 40 日
    family: 基本面
    mechanism: A 事件後漂移
    base: rev_confirm                   # 基礎事件：營收創 12 個月新高的生效日（10 日當天或之後第一個交易日）收盤上漲、量 ≥ vol_ratio × 前 20 日均量
    hold: 40
    params: { rs_min: 70, vol_ratio: 1.5 }
  - id: squeeze_breakout
    enabled: true
    label: 收斂後突破
    subtitle: RS ≥ 80・20 日波動低於 60 日・收盤突破前 20 日高點且量 ≥ 1.5 倍・持有 40 日
    family: 動能
    mechanism: B 趨勢延續
    base: squeeze_breakout              # 基礎事件：收盤 > 前 20 日最高收盤（前一日未突破）、20 日已實現波動 < 60 日（固定）、量 ≥ vol_ratio
    hold: 40
    params: { rs_min: 80, vol_ratio: 1.5 }
  - id: inst_pullback
    enabled: true
    label: 投信買回檔
    subtitle: 投信 20 日淨買超 ≥ 1 倍日均量・RS ≥ 70・回檔至 20 日線附近且在 60 日線上・持有 20 日
    family: 籌碼
    mechanism: C 法人持續建倉
    base: inst_pullback                 # 基礎事件：投信 20 日累計淨買超 ÷ 前 20 日均量 ≥ trust_ratio、RS ≥ rs_min、收盤 ≤ 20 日線 ×1.02 且 ≥ 60 日線且 ≤ 前 20 日高 ×0.95（條件首次成立）
    hold: 20
    params: { rs_min: 70, trust_ratio: 1.0 }
