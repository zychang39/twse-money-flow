# 策略庫（M2；METHODOLOGY §11）：把指標效度評估（config/evidence.yml）判定為「有效」或「環境依賴」的指標包成內建策略。
# 是否上架由每日重算的判定決定（資料驅動）；沒有通過的候選列在「未通過驗證」並寫明原因，不能設為訊號追蹤。
# 命名規則（CLAUDE.md 產品原則 9）：主標最多 5 個字、一看就知道條件、不用比喻或術語；副標以「・」列出條件。
# 改名時把舊名稱放進 aliases；id 不改（訊號追蹤、網址沿用）。策略清單依規則產生，非推薦。
# 2026-10-01 審查精簡曾把 13 套全部 enabled: false；2026-10-02 第二輪改為資料驅動的分級（config/evidence.yml grading：
# 有效／觀察中／停用，每次部署重算，集保等資料補齊後自動重分級，不需人工改旗標；DECISIONS #194）。
# enabled: false 仍可作人工覆寫（強制停用，程式不刪）；audit_note 保留第一輪的審查數字供對照。
horizon: 40                   # 策略報表與訊號追蹤的預設持有日數（與判定一致；2026-10-02 第二輪由 10 改 40）
slots: [1, 3, 5, 10]          # 槓桿計算：同時持有檔數（預先模擬的組合）
recent_days: 60               # 策略健康度：最近 60 個交易日 vs 長期
health:
  min_recent: 20              # 近期樣本少於 20 筆 →「資料累積中」
leverage:
  ceiling: 2.5                # 倍數天花板（台股融資成數 6 成，最多約 2.5 倍）
  default_max_dd: 20          # 最大可承受回撤（%）
  default_interest: 6         # 融資年利率（%）
  default_breaker: 10         # 回撤斷路器（%）
  margin_loan_ratio: 0.6      # 融資成數
  maintenance_call: 130       # 融資維持率低於 130% 追繳
  lock_days: 2                # 「連續 2 日跌停鎖死」情境
  limit_pct: 10               # 跌停幅度（%）
strategies:
