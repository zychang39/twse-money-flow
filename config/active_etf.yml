# 主動式 ETF 的投資策略標籤（2026-10-09）
# 依各投信官網、公開說明書或證交所 ETF 資訊站（ETFortune）的投資策略文字歸納；只描述選股方式與範圍，不是推薦。
# web 直接讀這個檔（web/src/lib/etfTags.ts）：清單列顯示標籤，詳細頁顯示標籤、一句摘要與依據網址。
# 新 ETF 掛牌後在 etfs 補一筆；沒有資料的 ETF 清單上不顯示標籤。
# tags：1～3 個，第一個為主要特徵，詞彙限 tags 區塊（vitest etfTags.test.ts 檢查）；strategy：一句摘要（最多 60 字）；
# source：依據網址；source_kind：官網｜公開說明書｜證交所｜其他。
version: 1
tags:
  大型股: 以市值前 N 大（50／150／200／300 大）的股票為主要選股池
  動能: 依價格、營收或獲利的動能與產業強弱勢汰弱擇強
  成長: 以獲利或營收的成長潛力選股
  高息: 以股息收益為核心（高股息篩選或配息設計）
  量化: 以量化或多因子模型選股、最佳化權重
  品質: 以財務體質、競爭力、產業地位（龍頭、護城河）篩選
  權利金: 以掩護性買權策略收取權利金作為配息來源
  科技: 以科技產業為主
  AI: 以 AI 產業鏈為主題
  創新: 以創新企業為主題
  金融: 以金融產業為主
  美股: 投資美國股票
  全球: 投資全球股票（沒有區域標籤＝台股）
