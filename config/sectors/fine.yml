# 細產業（族群第二層）的人工整理檔（自行整理・可編輯）。pipeline/derive/sectors.py 讀取。
#
# 細產業的取得順序（M1.2）：
#   1. 櫃買中心「產業價值鏈資訊平台」（config/sectors/tpex_chain.csv，`python -m pipeline sectors-refresh` 更新）：
#      每個「產業鏈 › 子類別」是一個細產業，鍵＝「鏈代碼/子類別代碼」（例 D000/D310＝半導體 › 晶圓製造）。
#   2. 公開資訊觀測站的公司主要產品與營收比重：2026-10-03 實測自雲端環境連線被拒（安全性頁面，錯誤代碼頁），
#      無法自動取得；改由第 3 項人工整理。
#   3. 本檔：手動細產業（manual）、未被產業價值鏈涵蓋的股票的對照（assign）、主要細產業的優先順序（official_chains）。
# 一檔股票可屬於多個細產業；預設主要細產業為 primary 指定者，否則依 official_chains 的順序取第一個。
updated: "2026-10-03"

