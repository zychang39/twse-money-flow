# 細產業整理（2026-10-06；pipeline/derive/sectors.py tidy_fine）：產業價值鏈直接拆成細產業會有大量 1–2 檔、
# 成員完全相同、同名或名稱沒有意義的族群。整理規則：
#   theme_chains_as_themes：上面的「主題型產業鏈」不當細產業，一條鏈改成一個題材（分段＝鏈內類別）。
#   fold_below：成員少於這個數的子類別併入同類別的「（其他）」；類別合併後仍不足再併入產業鏈的「（其他細項）」。
#   rename：鍵＝「鏈代碼/子類別代碼」，換成看得懂的名稱。
#   generic_names：名稱本身看不出產業（其他、原料、系統整合…）時一律加產業鏈名稱；不同產業鏈同名時也會加。
#   name_fixes：來源的錯字與被去掉空白的英文（子字串取代）。
tidy:
  theme_chains_as_themes: true
  fold_below: 5
  rename:
    "D000/D400": 晶圓製程及檢測設備       # 中游；與 D600 同名「生產製程及檢測設備」
    "D000/D600": 封測製程及檢測設備       # 下游（與基板、導線架、封測同段）
    "X000/X400": 其他產業（未細分）       # 產業價值鏈「其他 › 其他」
    "3000/3180": 其他汽車零組件
    "A300/A320": 動力電池、電池管理與馬達等零組件
    "U000/U100": 金控、銀行與保險
  generic_names: [其他, 其他零組件, 原材料, 原料, 原物料, 材料, 化學品, 系統整合, 顧問諮詢, 銷售、進出口業務, 製造商, 發電營運, 電纜]
  name_fixes:
    "Dear-EyeDisplay": "Near-Eye Display"
    "VRHeadset": "VR Headset"
    "ARSmartGlasses": "AR Smart Glasses"
    "MRHeadset&SG": "MR Headset & Smart Glasses"
    "QualcommXRPlatform": "Qualcomm XR Platform"
    "LightEngine": "Light Engine"
    "資通訊安全": "資安"

# 手動細產業：產業價值鏈沒有單獨分出來的分類。members 會加進該細產業；primary_for 指定成為主要細產業的股票。
# 成員少於 5 檔時不單獨排名，併入 parent（產業價值鏈的子類別）並標示。
manual:
  - id: m/ic_substrate
    name: IC 載板
    parent: L000/L610
    basis: 產業價值鏈「印刷電路板 › 硬板、軟板、IC載板製造」與「半導體 › 基板」中，以 IC 載板為主要產品的公司（公司年報主要產品）
    date: "2026-10-03"
    members: ["3037", "8046", "3189", "4958"]
    primary_for: ["3037", "8046", "3189"]
  - id: m/sport_goods
    name: 運動鞋與運動用品
    parent: X000/X400
    basis: 產業價值鏈把運動鞋代工與運動用品廠歸在「其他 › 其他」，運動科技鏈改列題材後另有幾檔沒有細產業；依公司公開的主要產品整理（2026-10-06）
    date: "2026-10-06"
    members: ["9904", "9910", "9802", "6768", "6890", "8467", "6965", "7811"]
    primary_for: ["9904", "9910", "9802", "6768", "6890", "8467", "6965", "7811"]

