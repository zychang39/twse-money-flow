# ETF：依代號後綴與名稱分類（官方沒有產業別）；順序即判斷順序，第一個符合者。
etf:
  - { id: etf/active, name: 主動式 ETF, rule: { code_suffix: A, name_prefix: 主動 } }
  - { id: etf/leveraged, name: 槓桿與反向 ETF, rule: { code_suffix: [L, R] } }
  - { id: etf/bond, name: 債券 ETF, rule: { code_suffix: B } }
  - { id: etf/futures, name: 期貨與商品 ETF, rule: { code_suffix: U } }
  - { id: etf/dividend, name: 高股息 ETF, rule: { name_any: [高息, 高股息, 股息, 優息, 收益] } }
  - { id: etf/overseas, name: 海外股票 ETF, rule: { name_any: [美國, 美股, 日本, 日經, 中國, 上証, 滬深, 恒生, 印度, 越南, 歐洲, 全球, 標普, NASDAQ, 那斯達克, 費城, 道瓊, 富時, 韓國, 東協, 新興, 亞洲] } }
  - { id: etf/theme, name: 產業與主題 ETF, rule: { name_any: [半導體, 科技, 5G, 電動車, AI, 網通, 綠能, 永續, ESG, 金融, 生技, 電池, 晶片, IC, 創新, 低碳, 機器人, 智能, 雲端, 資安, 元宇宙] } }
  - { id: etf/market, name: 市值型與其他 ETF, rule: {} }
