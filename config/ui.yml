# 介面行為參數（單一事實來源；只影響「怎麼呈現」，不影響分數與指標計算）
version: 1

# 變化優先：自上次查看以來的變化，低於門檻視為雜訊、預設收合
significance:
  price_pct: 3.0            # |漲跌幅| ≥ 3%（自上次查看的收盤價變化）
  composite_points: 5       # 綜合分變化 ≥ 5 分
  inst_streak_days: 5       # 外資或投信「新達到」連買／連賣 ≥ 5 日
  inst_volume_pct: 25       # 當日外資＋投信淨買賣超 ≥ 成交量 25%
  margin_pct: 8             # 融資餘額變化 ≥ 8%
  near_stop_pct: 3          # 持股收盤價距停損 ≤ 3% 視為「接近停損」

# 資金環境燈號（由市場頁的 5 項資金指標彙總）：只有「保守」使用琥珀色
env_state:
  conservative_min_red: 1   # 任一指標為風險（紅燈）→ 保守
  aggressive_min_green: 3   # 沒有風險且 ≥ 3 項有利（綠燈）→ 積極；其餘 → 中性

# 衝動攔截：新增持倉前，符合任一條件就先顯示冷靜卡
impulse:
  env_conservative: true    # 資金環境為保守
  ma20_gap_pct: 10          # 股價高於 20 日均線超過 10%
  price_change_5d_pct: 15   # 近 5 日漲幅超過 15%

# 回測可信度（依訊號樣本數）
backtest_confidence:
  low_below: 30             # 樣本 < 30 → 可信度低
  high_from: 100            # 樣本 ≥ 100 → 可信度高；其餘為中

# 遊戲化：只獎勵紀律行為，不因交易次數、頻率或獲利給予任何獎勵
gamification:
  review_window_days: 30    # 近 30 天平倉的交易都要有檢討，第三環才算完成
  stop_respected_tolerance_pct: 2   # 出場價 ≤ 停損價 × (1 + 2%) 且為虧損出場 → 「守住停損」
  xp:
    brief_read: 10          # 看完今晚簡報（每個交易日一次）
    checklist_done: 20      # 完成買進前檢查表（含「檢查後決定不進場」；每日最多一次）
    review_done: 30         # 完成一筆平倉檢討（每日最多 3 筆）
    ritual_done: 20         # 三環全部完成（每個交易日一次）
    backup: 20              # 匯出備份（每 7 天最多一次）
    backtest_own: 15        # 回測自己的條件（每日最多一次）
  level_step: 100           # 升到第 n 級所需累積 XP = step × n(n−1)/2
  badges:
    - id: first_ritual
      label: 第一次今晚儀式
      description: 第一次完成今晚的三環。
      metric: rituals
      target: 1
    - id: streak_7
      label: 連續 7 天
      description: 連續 7 個交易日完成今晚儀式（休市日不中斷）。
      metric: best_streak
      target: 7
    - id: streak_30
      label: 連續 30 天完成儀式
      description: 連續 30 個交易日完成今晚儀式（休市日不中斷）。
      metric: best_streak
      target: 30
    - id: reviews_20
      label: 完成 20 筆檢討
      description: 累積 20 筆寫有檢討內容的平倉紀錄。
      metric: reviews
      target: 20
    - id: stops_10
      label: 守住停損 10 次
      description: 10 次在停損價附近出場（虧損出場且出場價不低於停損價過多）。
      metric: stops_respected
      target: 10
    - id: checklists_10
      label: 完成 10 份檢查表
      description: 完成 10 份買進前檢查表（包含檢查後決定不進場）。
      metric: checklists
      target: 10
    - id: backtest_own
      label: 回測過自己的條件
      description: 用自己儲存的選股條件跑過一次回測。
      metric: backtests_own
      target: 1
    - id: first_backup
      label: 首次備份
      description: 第一次匯出本機資料備份。
      metric: backups
      target: 1
