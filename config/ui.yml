# 介面行為參數（單一事實來源；只影響「怎麼呈現」，不影響分數與指標計算）
version: 1

# 變化優先：自上次查看以來的變化，低於門檻視為雜訊、預設收合
significance:
  price_pct: 3.0            # |漲跌幅| ≥ 3%（自上次查看的收盤價變化）
  composite_points: 5       # 綜合分變化 ≥ 5 分
  inst_streak_days: 5       # 外資或投信「新達到」連買／連賣 ≥ 5 日
  inst_volume_pct: 25       # 當日外資＋投信淨買賣超 ≥ 成交量 25%
  margin_pct: 8             # 融資餘額變化 ≥ 8%
  near_stop_pct: 3          # 持股收盤價距停損 ≤ 3% 視為「接近停損」

# 資金環境燈號（由市場頁的 5 項資金指標彙總）：只有「保守」使用琥珀色
env_state:
  conservative_min_red: 1   # 任一指標為風險（紅燈）→ 保守
  aggressive_min_green: 3   # 沒有風險且 ≥ 3 項有利（綠燈）→ 積極；其餘 → 中性

# 衝動攔截：新增持倉前，符合任一條件就先顯示冷靜卡
impulse:
  env_conservative: true    # 資金環境為保守
  ma20_gap_pct: 10          # 股價高於 20 日均線超過 10%
  price_change_5d_pct: 15   # 近 5 日漲幅超過 15%

# 回測可信度（依訊號樣本數）
backtest_confidence:
  low_below: 30             # 樣本 < 30 → 可信度低
  high_from: 100            # 樣本 ≥ 100 → 可信度高；其餘為中

# 遊戲化：只獎勵紀律行為，不因交易次數、頻率或獲利給予任何獎勵
gamification:
  review_window_days: 30    # 近 30 天平倉的交易都要有檢討，第三環才算完成
  stop_respected_tolerance_pct: 2   # 出場價 ≤ 停損價 × (1 + 2%) 且為虧損出場 → 「守住停損」
  xp:
    brief_read: 10          # 看完今晚簡報（每個交易日一次）
    checklist_done: 20      # 完成買進前檢查表（含「檢查後決定不進場」；每日最多一次）
    review_done: 30         # 完成一筆平倉檢討（每日最多 3 筆）
    ritual_done: 20         # 三環全部完成（每個交易日一次）
    backup: 20              # 匯出備份（每 7 天最多一次）
    backtest_own: 15        # 回測自己的條件（每日最多一次）
  level_step: 100           # 升到第 n 級所需累積 XP = step × n(n−1)/2
  badges:
    - id: first_ritual
      label: 第一次今晚儀式
      description: 第一次完成今晚的三環。
      metric: rituals
      target: 1
    - id: streak_7
      label: 連續 7 天
      description: 連續 7 個交易日完成今晚儀式（休市日不中斷）。
      metric: best_streak
      target: 7
    - id: streak_30
      label: 連續 30 天完成儀式
      description: 連續 30 個交易日完成今晚儀式（休市日不中斷）。
      metric: best_streak
      target: 30
    - id: reviews_20
      label: 完成 20 筆檢討
      description: 累積 20 筆寫有檢討內容的平倉紀錄。
      metric: reviews
      target: 20
    - id: stops_10
      label: 守住停損 10 次
      description: 10 次在停損價附近出場（虧損出場且出場價不低於停損價過多）。
      metric: stops_respected
      target: 10
    - id: checklists_10
      label: 完成 10 份檢查表
      description: 完成 10 份買進前檢查表（包含檢查後決定不進場）。
      metric: checklists
      target: 10
    - id: backtest_own
      label: 回測過自己的條件
      description: 用自己儲存的選股條件跑過一次回測。
      metric: backtests_own
      target: 1
    - id: first_backup
      label: 首次備份
      description: 第一次匯出本機資料備份。
      metric: backups
      target: 1

# ---------- 個股籌碼明細與區間統計（METHODOLOGY §4.7.1） ----------
chip:
  days: 60                        # 匯出與顯示的最長交易日數（pipeline 另多帶前一日算增減）
  table_periods: [5, 10, 20, 60]  # 每日明細表的期間
  table_default: 10
  stats_periods: [1, 3, 5, 10, 20, 60]  # 區間統計卡的天數
  stats_default: 5
  sentence_min_pct: 0.5           # 各法人區間買賣超都不到成交量的此 % 時，結論寫「都不到」
  streak_min: 3                   # 連買／連賣達此天數才寫進結論

# 信用與空方（個股頁；v3 M2，METHODOLOGY §4.7.5）：每個數字都標明比較基準
credit:
  compare_days: [5, 20]     # 融資餘額變化的比較基準（交易日前）
  pv_days: 5                # 價量解讀：股價與融資的 N 日方向
  short_ratio_high: 30      # 券資比 ≥ 30% 視為偏高（融券回補買盤可能推升股價：軋空風險）
  foreign_change_days: 20   # 外資持股比的變化基準（交易日前）

# 系統清單「熱門動能」：每個交易日由 pipeline 依規則自動產生（依規則產生，非推薦）。
# 顯示在「我的股票 → 自選」之下的唯讀群組；可一鍵複製成自己的群組，或只挑其中幾檔。
hot_momentum:
  label: 熱門動能
  exclude_etf: true         # 只看普通股（代號 00 開頭的 ETF／ETN 不列入）
  value_rank_top: 150       # 當日成交值排名前 150 名（流動性足夠、市場正在關注）
  min_rs_percentile: 80     # RS（相對強弱，近 3–12 個月加權報酬）百分位 ≥ 80（定義見 METHODOLOGY 4.2）
  max_warn_flags: 1         # 注意級風險旗標最多 1 個
  max_danger_flags: 0       # 不能有危險級風險旗標（處置、全額交割、停券…）
  size: 10                  # 依 RS 百分位由高到低取前 10 檔（同分以成交值排序）

# 新用戶範例自選：歡迎卡「加入範例自選」使用；加入後標示「範例」，可一鍵清除
sample_watchlist:
  group: 範例
  codes: ["2330", "2317", "2454", "2382", "0050"]  # 台積電、鴻海、聯發科、廣達、元大台灣50

# 大戶／散戶持股（個股頁 → 大戶與散戶持股；METHODOLOGY §4.7.3）
holders:
  # 門檻的可選刻度（張）＝集保持股分級的邊界；1 張以下為零股
  breakpoints: [1, 5, 10, 15, 20, 30, 40, 50, 100, 200, 400, 600, 800, 1000]
  # 全站統一的分級定義（v3；畫面上直接顯示）。只能落在集保分級邊界：
  #   散戶 ≤ 5 張（分級 1–2）｜中實戶 5–400 張（分級 3–11）｜大戶 ≥ 400 張（分級 12–15，含千張大戶）｜千張大戶 ≥ 1,000 張（分級 15）
  #   集保分級的邊界是「400,001 股起」「1,000,001 股起」，畫面以常用說法寫「≥ 400 張」「≥ 1,000 張」（METHODOLOGY §4.7.3）
  tiers:
    retail_max: 5
    big_min: 400
    whale_min: 1000
  weeks: 52                 # 個股檔輸出的週數
  # 集保個股歷史查詢（backfill --source tdcc_history）：官方保存一年；逐檔逐週查詢，每次執行有請求上限
  history:
    codes: []               # 額外指定的股票
    top_value: 30           # 加上最近交易日成交值前 N 名（不含 ETF）
    max_codes: 60
    max_requests: 1500      # 每次執行的查詢上限（約 51 次／檔；3–5 秒間隔 ≈ 1.5 小時）

# 多空對照（個股頁 → 多空對照；METHODOLOGY §4.7.4）：規則式條件，每一項權重相同；不是買賣建議
bull_bear:
  price_volume:
    volume_ratio: 1.2          # 放量：成交量 ≥ 20 日均量 × 1.2
    near_high_pct: -5          # 距 52 週高點 5% 以內
    far_high_pct: -30          # 距 52 週高點超過 30%
    rs_strong: 70              # RS 百分位
    rs_weak: 30
    daytrade_high: 40          # 當沖比率（%）偏高
  technical:
    rsi_period: 14
    rsi_hot: 70
    rsi_cold: 30
    macd: [12, 26, 9]
    cross_days: 5              # 幾日內的黃金／死亡交叉另外註明
  chip:
    streak_days: 3             # 外資、投信連買／連賣天數
    insti_days: 20             # 三大法人合計的統計天數
    insti_pct: 3               # 三大法人合計買賣超佔成交量 ±3%
    margin_pct: 5              # 融資 5 日增減 ±5%
    whale_pp: 0.3              # 千張大戶週變化 ±0.3 個百分點
  fundamental:
    revenue_yoy_good: 20       # 近 3 月營收年增率（%）
    revenue_yoy_bad: -10
    growth_months: 6           # 營收連續年增月數
    roe_good: 15
    roe_bad: 3
    pe_low_pct: 20             # 本益比位於自身 3 年百分位
    pe_high_pct: 80
    yield_good: 5              # 殖利率（%）
    gross_margin_pp: 2         # 毛利率與去年同季相比 ±2 個百分點
