        status: verified
        method: 'POST JSON {"fundId": 基金代碼, "date": "YYYY/MM/DD" 或 null＝最新}（基金代碼由 list_url 取得）；date＝申購買回清單適用日，回應 pcf.date2 為持股日'
        lag_days: 1   # 查詢日（公告日）比持股日晚 1 個交易日
        list_url: https://www.capitalfund.com.tw/CFWeb/api/etf/items
        url: https://www.capitalfund.com.tw/CFWeb/api/etf/buyback
      yuanta:
        label: 元大投信
        keyword: 元大
        status: verified
        method: 'GET；date＝申購買回清單公告日（不帶＝最新），回應的 trandate 為持股日'
        lag_days: 2   # 00990A（全球型）公告日比持股日晚 2 個交易日
