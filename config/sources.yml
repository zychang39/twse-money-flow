# 資料源設定（單一事實來源）
# url 佔位符：{date}=YYYYMMDD、{date_slash}=YYYY/MM/DD、{start}/{end}=YYYYMMDD、
#             {start_slash}/{end_slash}=YYYY/MM/DD、{roc_year}=民國年、{month}=月（不補零）、
#             {year}=西元年、{quarter}=季（兩位數）
# frequency：daily（每交易日一檔）、range（區間查詢，依日期切檔）、weekly、monthly、quarterly、snapshot（最新快照）
# tier：core（核心）、advanced（進階）、optional（選配）
# status：verified（已用真實樣本驗證）、unverified（未以真實樣本驗證）、pending（資料源待處理）
version: 1
crawl:
  delay_seconds: [3, 5]        # 依序請求，間隔 3–5 秒 + 隨機抖動
  timeout_seconds: 60
  max_retries: 4               # 指數退避：2、4、8、16 秒
  circuit_breaker: 5           # 同一網域連續失敗 5 次即停止該網域本輪請求
  user_agent: "twse-money-flow/1.0 (+https://github.com/zychang39/twse-money-flow)"
  timezone: Asia/Taipei

# 歷史長度（v3 M5）：收盤行情回補 10 年（或各來源實測可取得的最早日期），籌碼類維持 3 年
history:
  price_sources: [twse_quotes, tpex_quotes]
  price_years: 10             # backfill 只指定收盤行情且未給起日時，預設回補 10 年
  default_years: 3            # 其他來源（籌碼、信用、估值…）未給起日時回補 3 年
  derive_window_days: 1100    # 衍生計算（指標、分數、選股、回測、個股檔）只取最近 N 個交易日（約 4.5 年）；更早的股價另存長歷史檔
  earliest:                   # 各來源可取得的最早日期（依實測 2026-09-28；早於此日不發請求）
    twse_quotes: "2004-02-11"   # MI_INDEX 2004-02-11 有 696 筆；證交所網站此報表自 2004-02-11 起
    tpex_quotes: "2010-01-04"   # 2010-01-04 有 538 筆；2007-01-02（交易日）回傳空表，2007–2009 未逐日實測

