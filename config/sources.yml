# 資料源設定（單一事實來源）
# url 佔位符：{date}=YYYYMMDD、{date_slash}=YYYY/MM/DD、{start}/{end}=YYYYMMDD、
#             {start_slash}/{end_slash}=YYYY/MM/DD、{roc_year}=民國年、{month}=月（不補零）、
#             {year}=西元年、{quarter}=季（兩位數）
# frequency：daily（每交易日一檔）、range（區間查詢，依日期切檔）、weekly、monthly、quarterly、snapshot（最新快照）
# tier：core（核心）、advanced（進階）、optional（選配）
# status：verified（已用真實樣本驗證）、unverified（未以真實樣本驗證）、pending（資料源待處理）
version: 1
crawl:
  delay_seconds: [3, 5]        # 依序請求，間隔 3–5 秒 + 隨機抖動
  timeout_seconds: 60
  max_retries: 4               # 指數退避：2、4、8、16 秒
  circuit_breaker: 5           # 同一網域連續失敗 5 次即停止該網域本輪請求
  user_agent: "twse-money-flow/1.0 (+https://github.com/zychang39/twse-money-flow)"
  timezone: Asia/Taipei

sources:
  # ---------- 核心：上市 ----------
  twse_quotes:
    label: 上市每日收盤行情
    market: twse
    tier: core
    frequency: daily
    url: https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date={date}&type=ALLBUT0999&response=json
    publish: "約 14:00"
    status: verified
  twse_index:
    label: 上市指數（加權、報酬、類股）
    market: twse
    tier: core
    frequency: daily
    derived_from: twse_quotes   # 與收盤行情同一個回應（MI_INDEX）
    publish: "約 14:00"
    status: verified
  twse_insti:
    label: 上市三大法人買賣超
    market: twse
    tier: core
    frequency: daily
    url: https://www.twse.com.tw/rwd/zh/fund/T86?date={date}&selectType=ALLBUT0999&response=json
    publish: "約 15:00–16:30"
    status: verified
  twse_margin:
    label: 上市融資融券
    market: twse
    tier: core
    frequency: daily
    url: https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date={date}&selectType=ALL&response=json
    publish: "約 21:00"
    status: verified
  twse_valuation:
    label: 上市本益比／殖利率／淨值比
    market: twse
    tier: core
    frequency: daily
    url: https://www.twse.com.tw/rwd/zh/afterTrading/BWIBBU_d?date={date}&selectType=ALL&response=json
    publish: "約 14:30"
    status: verified
  twse_exright:
    label: 上市除權除息計算結果
    market: twse
    tier: core
    frequency: range
    url: https://www.twse.com.tw/rwd/zh/exRight/TWT49U?startDate={start}&endDate={end}&response=json
    publish: "除權息交易日當日"
    status: verified
  twse_exright_notice:
    label: 上市除權除息預告
    market: twse
    tier: core
    frequency: snapshot
    url: https://www.twse.com.tw/rwd/zh/exRight/TWT48U?response=json
    status: verified
  twse_capreduce:
    label: 上市減資恢復買賣參考價
    market: twse
    tier: core
    frequency: range
    url: https://www.twse.com.tw/rwd/zh/reducation/TWTAUU?startDate={start}&endDate={end}&response=json
    status: verified
  twse_attention:
    label: 上市注意股
    market: twse
    tier: core
    frequency: range
    url: https://www.twse.com.tw/rwd/zh/announcement/notice?querytype=1&startDate={start}&endDate={end}&response=json
    publish: "約 17:00"
    status: verified
  twse_disposition:
    label: 上市處置股
    market: twse
    tier: core
    frequency: range
    url: https://www.twse.com.tw/rwd/zh/announcement/punish?startDate={start}&endDate={end}&response=json
    publish: "約 17:00"
    status: verified
  twse_attention_accum:
    label: 上市注意累計次數可能達處置標準
    market: twse
    tier: core
    frequency: snapshot
    url: https://openapi.twse.com.tw/v1/announcement/notetrans
    status: verified
  twse_revenue:
    label: 上市月營收（最新一期）
    market: twse
    tier: core
    frequency: snapshot
    url: https://openapi.twse.com.tw/v1/opendata/t187ap05_L
    publish: "每月 10 日前陸續公布"
    status: verified
  twse_company:
    label: 上市公司基本資料（產業別、股本）
    market: twse
    tier: core
    frequency: snapshot
    url: https://openapi.twse.com.tw/v1/opendata/t187ap03_L
    status: verified
  twse_holidays:
    label: 證交所休市日曆
    market: twse
    tier: core
    frequency: yearly
    url: https://www.twse.com.tw/rwd/zh/holidaySchedule/holidaySchedule?date={year}0101&response=json
    status: verified

