# 分段更新（M3.4；METHODOLOGY §12、DATA_SOURCES「公布時間實測」）
# 2026-10-06：排程改為依資料新鮮度補抓（下方 freshness.catchup）；這三段保留給手動觸發（task=stage）與狀態列的標籤，
# time＝補抓排程的台北時間。官方還沒公布時每 5 分鐘重試，最多 60 分鐘（只在手動 task=stage 時）。
retry:
  interval_minutes: 5
  max_minutes: 60
stages:
  close:
    label: 收盤行情
    time: "15:15"             # 台北；收盤行情約 14:00 公布（預期 15:00，含餘裕）
    sources: [twse_quotes, tpex_quotes, tpex_index, twse_intraday_index]  # 2026-10：每 5 秒指數統計約 14:00 已公布，與收盤行情同段抓（首頁 1D）
    ready: [twse_quotes, tpex_quotes]
    note: 價格與價格類訊號
    digest: false
  insti:
    label: 法人
    time: "16:30"             # 三大法人約 15:00 公布（預期 16:00，含餘裕）
    sources: [twse_quotes, tpex_quotes, twse_insti, tpex_insti, twse_valuation, tpex_valuation, twse_qfii, tpex_qfii, twse_insti_amount, tpex_insti_amount, twse_intraday_index]
    ready: [twse_insti, tpex_insti]
    note: 法人、訊號、今日新觸發、策略健康度；推送 Telegram（若有設定）
    digest: true
  credit:
    label: 信用
    time: "22:30"             # 融資融券約 21:00、借券約 21:30、當沖當晚（預期 22:00，含餘裕）
    sources: all              # 全部每日來源（含期交所、注意／處置、主動式 ETF）
    ready: [twse_margin, tpex_margin]
    note: 信用、借券、當沖與其他晚間資料
    digest: false

# 資料新鮮度（2026-10-06；METHODOLOGY §12.1）：前端 lib/freshness.ts 與 pipeline/freshness.py 共用這一張表，全站只用這一套。
# time＝交易日當天（Asia/Taipei）的「預期公布時間」，已含保守餘裕；sources＝判斷有沒有拿到的來源（config/sources.yml）。
# 對每個資料集 X：D(X)＝最近一個「預期公布時間已過」的交易日；資料日 ≥ D(X) 為最新，否則落後（以交易日計）。
# 預期時間未到 → 「尚未公布」；預期時間已過但沒有資料 → 「尚未更新」。
freshness:
  datasets:
    quotes:       { label: 收盤行情,   time: "15:00", sources: [twse_quotes, tpex_quotes] }
    index:        { label: 指數,       time: "15:00", sources: [twse_index, tpex_index] }
    intraday:     { label: 分鐘 K,     time: "15:00", sources: [twse_intraday_index] }
    insti:        { label: 三大法人,   time: "16:00", sources: [twse_insti, tpex_insti] }
    insti_amount: { label: 法人買賣金額, time: "16:00", sources: [twse_insti_amount, tpex_insti_amount] }
    taifex:       { label: 期貨法人,   time: "16:00", sources: [taifex_insti] }
    valuation:    { label: 本益比、淨值比, time: "16:00", sources: [twse_valuation, tpex_valuation] }
    qfii:         { label: 外資持股比, time: "17:00", sources: [twse_qfii, tpex_qfii] }
    credit:       { label: 融資融券,   time: "22:00", sources: [twse_margin, tpex_margin] }
    margin_total: { label: 融資總計,   time: "22:00", sources: [twse_margin, tpex_margin] }
    sbl:          { label: 借券,       time: "22:00", sources: [twse_sbl, tpex_sbl] }
    daytrade:     { label: 當沖,       time: "22:00", sources: [twse_daytrade, tpex_daytrade] }
  # 頁首「資料至 …」與橫幅只看這幾個資料集（其餘在資料健康頁）
  banner: [quotes, insti, credit, taifex]
  # 補抓排程（data.yml；台北時間）：每次只抓「依規則應已公布但還沒拿到」的資料集；有缺漏時 1 小時後再試，最多 3 次
  # 2026-10-07：加 08:05、10:05、12:05 三個起跑點——GitHub 排程常延遲 5–7 小時，任何一次排程觸發都能接上當天的接力（relay）
  catchup:
    times: ["08:05", "10:05", "12:05", "15:15", "16:30", "22:30"]
    crons: ["5 0 * * 1-5", "5 2 * * 1-5", "5 4 * * 1-5", "15 7 * * 1-5", "30 8 * * 1-5", "30 14 * * 1-5"]   # 同上（UTC），與 data.yml、pipeline/cli.py SCHEDULE_TASKS 以測試比對
    retry_minutes: 60
    max_retries: 3
    # 每日任務的其他來源（不在上表：主動式 ETF 持股、注意／處置、除權息、公司資料…）每個時段跑一次；時段起點＝這個時間與上表各預期公布時間
    extras_start: "08:00"
    # 接力（2026-10-07；pipeline/freshness.py plan_next）：每次補抓結束時，自己以 workflow_dispatch 預約下一次——
    # 今天下一個還沒到的預期公布時間＋offset_minutes（或重試時間，取早的）。dispatch 不像 schedule 會被延遲或丟掉，
    # 所以當天只要有一次觸發，之後 15:00／16:00／17:00／22:00 都會準時補抓。單次最多等 max_wait_minutes
    # （data job 上限 350 分鐘），更久就先等到上限再接下一棒。今天的資料集都過了預期時間（22:00 之後）、或休市日 → 不接力，
    # 隔天由排程起跑。同時只留一棒：已有不晚於目標時間的接力在等就不再觸發，比目標晚的取消（pipeline/notify/github.py）。
    relay:
      offset_minutes: 2
      max_wait_minutes: 300
