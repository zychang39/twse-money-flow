# 指標效度評估（M1；METHODOLOGY §10、docs/INDICATOR_EVIDENCE.md）
# 所有參數與「有效」的判定規則寫死在這裡，評估前決定，不得事後調整。

# 1.1 樣本範圍（universe）
universe:
  min_listed_days: 120          # 上市櫃滿 120 個交易日
  min_avg_value: 50000000       # 訊號日 20 日平均成交值 ≥ 5,000 萬元（2026-10-02 第二輪：原 2,000 萬，低成交值實際不可成交）
  avg_value_days: 20
  min_close: 10                 # 訊號日收盤價（未還原）≥ 10 元
  exclude_name_patterns: ["-DR"]   # 存託憑證；ETF、ETN、受益證券以代號排除（只收 4 碼、非 0 開頭的普通股）
  exclude_disposition: true     # 訊號日為處置股（處置期間內）
  exclude_full_delivery: true   # v3 M1：訊號日為變更交易（全額交割）或管理股票（逐日標記，METHODOLOGY §10.1）
  full_delivery_assume_days: 120  # 證交所只有「新增」的歷史、沒有恢復普通交易的日期：快照開始前已恢復者假設標記 120 個交易日

# 評估期間：價格類指標自 2017-01-01 起（2026-10-02 第二輪：除權息回補到 2016-01 後還原價自 2016-09 起可信；原 2022-01-01，
# 因官方除權息資料只到 2020-09；RS 需要 252 日還原價回看，所以實際訊號自 2017-09 起）；籌碼、營收等依各資料實際起始日（資料驅動）
price_start: "2017-01-01"

# 1.3 進出場
entry:
  limit_up_pct: 9.5             # 進場日開盤 ≥ 前一日收盤 +9.5% 視為開盤即漲停（無法進場）
  gap_pct: 5                    # 「排除跳空 ≥ 5%」變體
  limit_down_pct: -9.5          # 出場日最高價 ≤ 前一日收盤 −9.5% 視為跌停鎖死（當天賣不掉）
horizons: [5, 10, 20, 40, 60]   # v3 M3：加入 40、60 日（出場規則比較也有固定 40、60 日）
horizons_ref: [120]             # 只做參考、不進判定、不進出場比較
primary_horizon: 40             # 判定用的持有天數（2026-10-02 第二輪：原 10 日；成本固定、優勢隨持有累積，波段 40 日為主）
secondary_horizon: 20           # 並列判定的第二持有天數（分級要求 40 與 20 日扣成本超額皆 > 0）；10 日仍計算顯示但不判定

# v3 M3 事件時間累積超額曲線（有效、環境依賴的指標與三方同買）
curve:
  days: 60                      # 進場後第 1～60 個交易日
  exhaust_run: 5                # 邊際超額連續 5 日 ≤ 0 的第一天＝alpha 耗盡日
  per_day_scale: 250            # 每持有日超額年化：超額 ÷ N × 250
  extra_tests: [combo_three]    # 判定不是有效／環境依賴也要畫的指標

# 1.4 成本（審查修正 2026-10-01）：手續費 0.1425% 不打折（commission_discount 1.0）、證交稅 0.3%（costs.yml）、
# 滑價 0.1% 買賣各一次。基準（同日等權）不扣成本：benchmark_net_of_costs: true 可還原舊版（基準也扣成本，等於超額不含成本）。
costs:
  commission_discount: 1.0
  slippage: 0.001
benchmark_net_of_costs: false

# 1.4a 校正後 t 的取法（2026-10-02 第二輪，AUDIT.md 第二節第 4 點）：
# 同一天集中進場的策略（不重複進場日 ÷ 訊號期間交易日數 < concentration_ratio）一律用日曆時間法 t；
# 其餘取日曆時間法、Newey-West、不重疊區塊三者的最小值。不可取最大值。
t_corr:
  concentration_ratio: 0.25

# 1.5 統計
stats:
  t_threshold: 2.5              # 多重檢定：判定「有效」的 t 值門檻（一般 1.96 提高到 2.5）
  bootstrap: 1000               # 日期分層 bootstrap 次數
  seed: 20260929
  oos_fraction: 0.3333          # 樣本外＝訊號期間最後 1/3（有參數的指標改用 walk-forward 驗證期）
  quarter_end_days: 10          # 投信季底作帳：每季最後 10 個交易日
  trend_days: 60                # 大盤近 60 日趨勢
  regime_ma: 240                # 大盤 240 日線

# 1.8 判定（寫死）
verdict:
  min_events: 100               # 事件型：去重後樣本 ≥ 100
  min_months: 24                # 分組型：≥ 24 個月
  year_pass_ratio: 0.6667       # 逐年至少 2/3 的年份為正
  coverage_ratio: 0.5           # 涵蓋率 < 50% → 樣本範圍受限（涵蓋率定義見 METHODOLOGY §10.8：Σ每日有資料檔數 ÷ Σ每日 universe 檔數）
  coverage_full: 0.9            # v3：50–90% 標示「部分涵蓋」；≥ 90% 移除標示，並開始計算「原 31 檔 vs 全市場」
  sensitive_ratio: 0.5          # 相鄰參數格的平均超額報酬正負號相反，或不到選定格的一半 → 參數敏感
  wf_min_events: 30             # walk-forward 選參數時，訓練期樣本 < 30 的格子不選

# 1.9 指標參數
indicators:
  rs_event: 90
  high52_event: 0.95
  high52_bias_max: 0.10
  breakout_n: [20, 60]
  breakout_vol: 1.5
  breakout_close_pos: 0.75
  false_breakout_days: 5
  bias_event: 0.15
  kd: [9, 3, 3]
  kd_high: 80
  kd_run: 5
  macd: [12, 26, 9]
  macd_warmup: 60
  chip_runs: [3, 5, 10]
  chip_thresholds: [0.1, 0.3, 0.5]
  sync_days: 5
  extreme_pct: 95
  extreme_lookback: 250
  extreme_min_obs: 120
  whale_thresholds: [0.1, 0.3, 0.5]
  whale_weeks: 4
  margin_days: 5
  margin_price_pct: 3
  margin_change_pct: 3
  price_lead_days: 20
  price_lead_top: 0.9
  combo_rs: 80
  combo_trust_run: 3
  # v3 M4 三方同買參數格（27 格，walk-forward）：投信連買 n、外資近 5 日累計 ÷ 前 20 日均量門檻、千張大戶週增門檻（百分點）
  three_trust_runs: [3, 5, 10]
  three_foreign_thresholds: [0, 0.1, 0.3]
  three_whale_thresholds: [0.1, 0.3, 0.5]
  revenue_fallback_day: 10      # 月營收生效日：沒有公布日時為次月 10 日

# 1.10 出場規則（對判定為有效或環境依賴的指標）
exits:
  max_days: 60                  # 沒有時間上限的規則（均線、追蹤停損…）最多持有 60 個交易日
  stop_pct: [-5, -7, -10]       # 固定停損（其餘到 20 日出場），walk-forward 選擇
  stop_cap: 20
  trailing_pct: [8, 10, 15]     # 從最高收盤回落
  atr_period: 14                # 2026-10-02 健檢 M2：ATR 移動停損（收盤 ≤ 最高收盤 − k × ATR14），walk-forward 選 k
  atr_mult: [2, 3]
  ma_days: [10, 20, 60]         # 收盤跌破 N 日線
  exhaust_days: 3               # 動能衰竭：連續 3 日量能 < 0.5 倍且 3 日內漲跌 ≤ ±2%
  exhaust_vol: 0.5
  exhaust_move_pct: 2
recent_days: 60                # 策略健康度：最近 60 個交易日

# v3 M0-4 後見之明偏差：全市場集保回補前，千張大戶歷史只有這 31 檔（2026-09 依當時成交值前 30 名＋範例自選挑選，
# 由 data 分支 2026-09-29 回補開始前的 tdcc_history 還原）。涵蓋率達 coverage_full 後，大戶週增與三方同買另算「只用這 31 檔」的版本並列。
hindsight_codes: ["0050", "1303", "2303", "2308", "2317", "2327", "2330", "2344", "2368", "2382", "2383", "2408", "2409", "2454", "3026", "3037", "3042", "3105", "3189", "3324", "3443", "3653", "3665", "4958", "6182", "6213", "6274", "6488", "8046", "8150", "8299"]
hindsight_tests: [whale_up, combo_three]

# ------------------------------------------------------------------
# 2026-10-02 第二輪：分級與新策略門檻（全站門檻集中在這個檔案；成本費率在 costs.yml、使用者回測的滑價與鎖死在 thresholds.yml backtest）
# 分級（取代「全部停用」）：有效／觀察中／停用；判定持有天數 40 日為主、20 日並列；基準＝同日等權（畫面預設顯示相對 0050 含息）
grading:
  valid:
    net_excess_positive_horizons: [40, 20]   # 40 日與 20 日扣成本超額皆 > 0
    t_corr_min: 3                            # 校正後 t ≥ 3（40 日）
    split_date: "2022-01-01"                 # 2022 前後兩段皆為正
    year_pass_ratio: 0.7                     # 逐年至少七成為正
    per_month_min: 10                        # 每月觸發 ≥ 10
  watch:
    t_corr_min: 2                            # 觀察中：40 日扣成本超額 > 0 且校正後 t ≥ 2
  min_years_for_valid: 5                     # 樣本不足 5 年者最高只能列觀察中
  dedupe_corr: 0.8                           # 相關係數 > 0.8 只留較強者（校正後 t 高者）
  max_strategies: 15                         # 有效＋觀察中最多 15 套，超過依校正後 t 取前 15
# 新策略上線門檻（docs/swing/HYPOTHESIS.md 第五節）
swing_gates:
  dev: ["2017-01-01", "2022-01-01"]          # 開發段
  val: ["2022-01-01", "2024-11-01"]          # 驗證段
  test: ["2024-11-01", null]                 # 最終測試段（null＝資料結束；上一輪已查看兩次，非全新樣本）
  t_corr_min: 3
  test_vs_dev_min: 0.5
  year_pass_ratio: 0.7
  perturb_pct: 0.2
  delay_days: [1, 3]                         # 進場延後 1、3 日後超額仍 ≥ 原本的 50%
  delay_keep_ratio: 0.5
  per_month_min: 10
  win_payoff: [[50, 1.5], [55, 1.2]]         # 勝率 ≥ 50% 且賺賠比 ≥ 1.5，或勝率 ≥ 55% 且賺賠比 ≥ 1.2
  portfolio_slots: 10                        # 組合層：10 檔等權、槽位滿了就跳過
  portfolio_mdd_ratio: 1.2                   # 最大回撤不深於等權基準的 1.2 倍；年化報酬 > 同期等權基準
  common_rules:                              # 共用、不可調、不計入參數的組合層規則
    regime_ma: 240                           # 加權指數收盤在 240 日線下不開新倉
    bias_max: 0.20                           # 20 日乖離 > 20% 不進場
  forward_since: "2026-10-02"                # 前瞻驗證起算日（合併日）；滿 forward_days 個交易日後在策略頁顯示
  forward_days: 60
  max_trials: 9                              # 本輪嘗試上限（累計上限 14）
