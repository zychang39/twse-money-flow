# 資料 workflow：所有邏輯在 python -m pipeline，YAML 只負責排程與環境。
name: Data
on:
  schedule:
    - cron: "30 9 * * 1-5"      # 交易日 17:30（台北）每日任務
    - cron: "30 13 * * 1-5"     # 交易日 21:30（台北）每日任務（融資融券、當沖等晚間資料）
    - cron: "0 2 * * 6"         # 週六 10:00：集保股權分散表
    - cron: "0 3 11 * *"        # 每月 11 日：月營收
    - cron: "0 3 16 5,8,11 *"   # 季報法定期限後（5/15、8/14、11/14）
    - cron: "0 3 1 4 *"         # 年報法定期限後（3/31）
    - cron: "*/15 1-5 * * 1-5"  # 交易時段每 15 分鐘：盤中提醒
  workflow_dispatch:
    inputs:
      task:
        description: "任務"
        type: choice
        options: [daily, periodic, backfill, alerts]
        default: daily
      source:
        description: "來源 id（逗號分隔，可留白）"
        required: false
        default: ""
      start:
        description: "起日 YYYY-MM-DD（backfill）"
        required: false
        default: ""
      end:
        description: "迄日 YYYY-MM-DD（backfill）"
        required: false
        default: ""
      refresh:
        description: "backfill 時重抓已存在的每日檔案（需填來源；例：twse_insti,tpex_insti 補自營商買賣股數）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write
  actions: write
  pages: write
  id-token: write

# 會寫入 data 分支的任務共用 data-pipeline；盤中提醒只讀即時報價，另用 alerts 群組，避免被長時間回補卡住
concurrency:
  group: ${{ (github.event.schedule == '*/15 1-5 * * 1-5' || inputs.task == 'alerts') && 'alerts' || 'data-pipeline' }}
  cancel-in-progress: false

jobs:
  alerts:
    if: github.event.schedule == '*/15 1-5 * * 1-5' || inputs.task == 'alerts'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .alerts-state
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline alerts --state .alerts-state/state.json
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .alerts-state
          key: alerts-state-${{ github.run_id }}

  data:
    if: github.event.schedule != '*/15 1-5 * * 1-5' && inputs.task != 'alerts'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
      digest: ${{ steps.run.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - id: prepare
        run: python -m pipeline prepare-data --data-dir data
      - id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m pipeline run --data-dir data --chain --max-minutes 320
          --task "${{ inputs.task }}" --schedule "${{ github.event.schedule }}"
          --source "${{ inputs.source }}" --start "${{ inputs.start }}" --end "${{ inputs.end }}"
          --refresh "${{ inputs.refresh }}"
      - if: always() && steps.prepare.outcome == 'success'
        run: python -m pipeline commit-data --data-dir data
      - if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline report --data-dir data --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline keepalive

  deploy:
    needs: data
    if: always() && needs.data.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      digest: ${{ needs.data.outputs.digest }}
    secrets: inherit
