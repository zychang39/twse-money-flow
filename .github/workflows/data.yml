# 資料 workflow：所有邏輯在 python -m pipeline，YAML 只負責排程與環境。
name: Data
on:
  schedule:
    # M3.4 分段更新（config/schedule.yml；未公布時每 5 分鐘重試、最多 60 分鐘，每段各自部署）
    - cron: "15 6 * * 1-5"      # 14:15（台北）收盤行情 → 價格與價格類訊號
    - cron: "30 7 * * 1-5"      # 15:30（台北）法人 → 訊號、今日新觸發、策略健康度、Telegram
    - cron: "30 13 * * 1-5"     # 21:30（台北）信用、借券、當沖與其他晚間資料
    - cron: "0 2 * * 6"         # 週六 10:00：集保股權分散表
    - cron: "0 3 11 * *"        # 每月 11 日：月營收
    - cron: "0 3 16 5,8,11 *"   # 季報法定期限後（5/15、8/14、11/14）
    - cron: "0 3 1 4 *"         # 年報法定期限後（3/31）
    - cron: "*/15 1-5 * * 1-5"  # 交易時段每 15 分鐘：盤中提醒
    - cron: "40 14 * * 1-5"     # 22:40（台北）：接續在每日任務時段延後的回補分段（E-05）
  workflow_dispatch:
    inputs:
      task:
        description: "任務"
        type: choice
        options: [daily, periodic, backfill, holders_backfill, stage, probe, alerts]
        default: daily
      source:
        description: "來源 id（逗號分隔，可留白）"
        required: false
        default: ""
      start:
        description: "起日 YYYY-MM-DD（backfill）"
        required: false
        default: ""
      end:
        description: "迄日 YYYY-MM-DD（backfill）"
        required: false
        default: ""
      stage:
        description: "分段更新（task=stage）：close／insti／credit"
        required: false
        default: ""
      refresh:
        description: "backfill 時重抓已存在的每日檔案（需填來源；例：twse_insti,tpex_insti 補自營商買賣股數）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write
  actions: write
  pages: write
  id-token: write

# 盤中提醒只讀即時報價，用 alerts 群組。
# M0：全市場集保回補（holders_backfill）用自己的 holders-backfill 群組，和籌碼回補、每日任務互不排隊。
# v3 M0：再依 source 分群（lane=0/2、lane=1/2 兩道平行；空白或 lanes=2 是只負責觸發兩道的分派者）。
# M3.4：公布時間實測（probe）只抓取不寫資料，用 publish-probe 群組。
# E-05：回補用獨立的 data-backfill 群組（每段最多 40 分鐘、交易日 16:30–22:30 不開始新的一段），
# 不再和每日任務排同一個佇列（GitHub 同一群組只保留最新一個等待中的 run，長時間回補會把排程的每日任務擠掉）。
# 兩者可能同時寫入 data 分支：commit-data 推送失敗時 rebase 到遠端最新並合併 manifest 後重試（pipeline/gitdata.py）。
concurrency:
  group: ${{ (github.event.schedule == '*/15 1-5 * * 1-5' || inputs.task == 'alerts') && 'alerts' || (inputs.task == 'backfill' && 'data-backfill' || (inputs.task == 'holders_backfill' && format('holders-backfill-{0}', inputs.source) || (inputs.task == 'probe' && 'publish-probe' || 'data-pipeline'))) }}
  cancel-in-progress: false

jobs:
  alerts:
    if: github.event.schedule == '*/15 1-5 * * 1-5' || inputs.task == 'alerts'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .alerts-state
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline alerts --state .alerts-state/state.json
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .alerts-state
          key: alerts-state-${{ github.run_id }}

  data:
    if: github.event.schedule != '*/15 1-5 * * 1-5' && inputs.task != 'alerts'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
      digest: ${{ steps.run.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - id: prepare
        run: python -m pipeline prepare-data --data-dir data
      - id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m pipeline run --data-dir data --chain --max-minutes ${{ (inputs.task == 'backfill' || inputs.task == 'holders_backfill') && 40 || 320 }}
          --task "${{ inputs.task }}" --schedule "${{ github.event.schedule }}"
          --source "${{ inputs.source }}" --start "${{ inputs.start }}" --end "${{ inputs.end }}"
          --refresh "${{ inputs.refresh }}" --stage "${{ inputs.stage }}"
      - if: always() && steps.prepare.outcome == 'success'
        run: python -m pipeline commit-data --data-dir data
      # resume（22:40）只觸發延後的回補，不抓資料、沒有執行摘要，不回報
      - if: always() && github.event.schedule != '40 14 * * 1-5'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline report --data-dir data --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline keepalive

  deploy:
    needs: data
    # 只有 main 會部署 GitHub Pages：在開發分支執行的回補（v3 M5 的 10 年股價）只寫入 data 分支，不發布開發中的前端
    if: always() && needs.data.outputs.deploy == 'true' && github.ref_name == 'main'
    uses: ./.github/workflows/deploy.yml
    with:
      digest: ${{ needs.data.outputs.digest }}
    secrets: inherit
