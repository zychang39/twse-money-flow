# CI：PR 與 push 到 main 時跑 ruff、mypy、pytest、eslint、tsc、vitest、衍生 JSON 嚴格解析、build、Playwright 冒煙測試。
# Q-01：main 的部署（deploy.yml）以 workflow_run 等這個 workflow 在 main 上成功後才執行。
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt
      - run: pip install -r pipeline/requirements.txt -r pipeline/requirements-dev.txt
      - run: ruff check pipeline tests
      - run: ruff format --check pipeline tests
      - run: mypy
      - run: pytest

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pipeline demo-data --out web/public/data
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: 衍生資料可嚴格解析（E-01）
        run: npm run check-json -- public/data
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - name: WCAG AA 對比（設計 tokens）
        run: python3 scripts/contrast.py
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          CI: "true"
      - name: 對齊稽核（402×874：左緣、數值右緣、基線、溢出、行首標點、4 的倍數間距）
        working-directory: web
        run: |
          (npx vite preview --port 4173 --strictPort > /dev/null 2>&1 &)
          sleep 3
          node scripts/align-audit.mjs --out ../align-audit
