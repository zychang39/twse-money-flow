# 部署：main 的 CI 通過後（Q-01：workflow_run，不再在 push 時直接部署）或被 data.yml 觸發時（2026-10-08 起以
# workflow_dispatch 觸發，data.yml 不再等部署完成），產生衍生資料、嚴格檢查全部 JSON（E-01）、build、部署 GitHub Pages。
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_call:
    inputs:
      digest:
        description: "部署後推播 Telegram 盤後日報"
        type: string
        default: "false"
  workflow_dispatch:
    inputs:
      digest:
        description: "部署後推播 Telegram 盤後日報"
        type: string
        default: "false"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # CI 在 main 失敗（或被取消）時不部署；push 事件本身不再觸發部署
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    # build-web 隨資料累積已接近 30 分鐘（2026-10-04 實測 29 分），30 分上限會在 build 前被取消；
    # 2026-10-08 起指標效度評估有快取、月營收指標改為一次計算、JSON 清理改快速路徑
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run：部署 CI 實際測過的那個提交
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Checkout data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # 2026-10-08：指標效度評估的快取（輸入資料、pipeline 程式、config 都沒變就沿用上一次的輸出；pipeline/derive/evcache.py）。
      # 以最近一份快取還原，python 依內容雜湊決定能不能用；建置後以 meta.json 的雜湊存成新的快取（內容沒變就不重複存）。
      - uses: actions/cache/restore@v4
        with:
          path: .evidence-cache
          key: evidence-v1-restore-${{ github.run_id }}
          restore-keys: evidence-v1-
      - name: Build derived data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          # v3 M4-2：大戶涵蓋率達標、三方同買改判時推播（沒有設定就略過）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline build-web --data-dir data --out web/public/data --evidence-cache .evidence-cache
      - if: hashFiles('.evidence-cache/meta.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .evidence-cache
          key: evidence-v1-${{ hashFiles('.evidence-cache/meta.json') }}
      - name: 下載線上前一版（守門比對用；抓不到就只做欄位檢查）
        continue-on-error: true
        run: |
          mkdir -p prev
          for f in meta.json summary.json strategies.json evidence.json; do
            curl -sSf -o "prev/$f" "https://zychang39.github.io/twse-money-flow/data/$f" || rm -f "prev/$f"
          done
      - name: 衍生資料守門（欄位缺漏、日期倒退、筆數驟降 → 不部署、保留前一版）
        run: python -m pipeline guard --out web/public/data --previous prev
      - name: 前端資料驗證（檔案 ≤ 300KB、細產業與分鐘資料涵蓋、日期連續、合計一致；只記錄，不擋部署）
        continue-on-error: true
        run: python -m pipeline validate-web --out web/public/data
      - uses: actions/upload-artifact@v4
        with:
          name: web-data
          path: |
            web/public/data/summary.json
            web/public/data/market.json
            web/public/data/signals.json
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: 全部個股 JSON 可嚴格解析（E-01；有任何一檔失敗就不部署）
        run: npm run check-json -- public/data
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  digest:
    needs: [build, deploy]
    if: inputs.digest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: web-data
          path: web/public/data
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline digest --web-data web/public/data --data-dir data

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
