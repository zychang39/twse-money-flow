# 開發期專用（合併前移除）：修改 ci/dev-run.txt 並 push 到 claude/** 分支，即在 Actions 上執行其中的 pipeline 指令。
# 用途：本開發環境連不到證交所，需在 Actions 上以真實資料驗證 pipeline、執行回補。
name: Dev pipeline run
on:
  push:
    branches: ["claude/**"]
    paths: ["ci/dev-run.txt"]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: data-pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - id: prepare
        run: python -m pipeline prepare-data --data-dir data
      - name: Run commands from ci/dev-run.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          grep -v '^\s*#' ci/dev-run.txt | grep -v '^\s*$' | while read -r line; do
            echo "::group::python -m pipeline $line"
            python -m pipeline $line --data-dir data 2>&1 | tail -n 400
            echo "::endgroup::"
          done
      - if: always() && steps.prepare.outcome == 'success'
        run: python -m pipeline commit-data --data-dir data
      - if: always()
        run: |
          echo '## manifest' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          head -c 60000 data/last_run.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
